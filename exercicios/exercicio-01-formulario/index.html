<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 1 — Pedido de pizza</title>
</head>
<body>
    <h1>Pedido de pizza</h1>
    <form method="POST" action="teste.jsp">
        <label>Nome: <input type="text" name="nome"></label><br>
        <label>Email: <input type="email" name="email"></label><br>
        Tamanho:
        <label><input type="radio" name="Tamanho" value="G"> Grande</label>
        <label><input type="radio" name="Tamanho" value="M"> Médio</label>
        <label><input type="radio" name="Tamanho" value="P"> Pequeno</label><br>
        <label for="sabor">Sabor:</label>
        <select id="sabor" name="Sabor">
            <option value="Calabresa">Calabresa</option>
            <option value="Frango">Frango</option>
            <option value="Portuguesa">Portuguesa</option>
            <option value="Quatro Queijos">Quatro Queijos</option>
            <option value="Marguerita">Marguerita</option>
        </select><br>
        Adicionais:
        <label><input type="checkbox" name="borda" value="Borda Recheada"> Borda Recheada</label>
        <label><input type="checkbox" name="borda" value="Borda Catupiry"> Borda Catupiry</label><br>
        <label>Data de entrega: <input type="date" name="dataEntrega"></label><br>
        <label for="observacoes">Observações:</label><br>
        <textarea id="observacoes" name="Observacoes" rows="10" cols="30" placeholder="Observações"></textarea><br>
        <input type="submit" value="Enviar">
    </form>
</body>
</html>
